name: Cleanup stray v0.0.1

# 一次性清理：删掉首版试跑时误产出的 v0.0.1 Release 与 tag。
#
# 背景：首版首次推送时，release.yml 的冷启动逻辑写错了（基准取了 v0.0.0 → 首个 tag 成了
# v0.0.1 而不是约定的 v0.1.0）。修正逻辑需要「零 tag」的起点，所以先把这个残留清掉。
#
# 这个 workflow 是一次性的：清理完成后它会被下一笔提交删除。
on:
  push:
    branches: [main]

permissions:
  contents: write    # 删 Release 与 tag 都要 contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Diagnose
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          echo "### gh auth status"
          gh auth status 2>&1 || true
          echo "### gh repo view"
          gh repo view --json nameWithOwner 2>&1 || true
          echo "### releases (raw)"
          curl -sS -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print([(r["id"], r["tag_name"]) for r in d])' 2>&1 || true
          echo "### tags (raw)"
          git ls-remote --tags origin || true

      - name: Delete stray release and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          TAG=v0.0.1
          RID=$(curl -sS -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(next((r['id'] for r in d if r['tag_name']=='$TAG'), ''))" 2>/dev/null)
          echo "release id for $TAG = '${RID}'"
          if [ -n "$RID" ]; then
            code=$(curl -sS -o /tmp/del.out -w '%{http_code}' -X DELETE \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/${RID}")
            echo "DELETE release -> HTTP ${code}"; head -c 300 /tmp/del.out; echo
          else
            echo "no release id found for $TAG"
          fi
          # tag 单独删（Release 删除不会连带删 tag）
          code=$(curl -sS -o /tmp/deltag.out -w '%{http_code}' -X DELETE \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}")
          echo "DELETE tag -> HTTP ${code}"; head -c 300 /tmp/deltag.out; echo

      - name: Verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          echo "### remaining releases"
          curl -sS -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print([(r["id"], r["tag_name"]) for r in d])' 2>&1 || true
          echo "### remaining tags"
          git ls-remote --tags origin || true
