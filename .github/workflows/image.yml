name: Image

# 只做一件事：把 renderd 打成多架构镜像推到 ghcr。
#
# 为什么不和 release.yml 合并：发版是「承诺」，打镜像是「产线」。分开后
# 镜像可以按 commit 随时出（sha-xxxxxxx），版本号仍然只由 tag 决定。
#
# 为什么在 CI 打而不是在服务器上打：
#   · 服务器上构建实测会卡死在 apt 大包与 GitHub 大文件上（容器内网络挂死），
#     单次 2–5 分钟且不可预测；
#   · CI 有 gha 缓存，改一行 Python 的重建只要几十秒；
#   · 生产机只 pull，不装编译依赖，也不占用它的 CPU。
on:
  push:
    branches: [main]
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# 镜像不像发版，没有「半成品」：新的提交直接取代旧的构建
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 标签自己算，不用 metadata-action：少一个第三方 action，也少一处表达式踩坑。
      - name: Compute tags
        id: tags
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${{ github.repository_owner }}/cutduo-renderd"
          SHA="${GITHUB_SHA:0:7}"
          {
            echo "tags<<EOF"
            echo "${IMAGE}:sha-${SHA}"
            case "${GITHUB_REF}" in
              refs/tags/v*) echo "${IMAGE}:${GITHUB_REF_NAME}"; echo "${IMAGE}:latest" ;;
              refs/heads/main) echo "${IMAGE}:main" ;;
            esac
            echo "EOF"
            # 版本号注入镜像：tag 构建用纯版本号，分支构建用 0.0.0+sha。
            # 保证 /healthz 自报的版本与镜像标签一致。
            case "${GITHUB_REF}" in
              refs/tags/v*) echo "version=${GITHUB_REF_NAME#v}" ;;
              *) echo "version=0.0.0+${SHA}" ;;
            esac
          } >> "$GITHUB_OUTPUT"
          echo "本次将推送："; cat "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: renderd
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            RENDERD_VERSION=${{ steps.tags.outputs.version }}
          cache-from: type=gha,scope=renderd
          cache-to: type=gha,mode=max,scope=renderd
