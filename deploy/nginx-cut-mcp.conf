# cut-mcp.1task.cn · nginx vhost
#
# 放置：/www/server/panel/vhost/nginx/cut-mcp.1task.cn.conf
# 证书：acme.sh --issue -d cut-mcp.1task.cn --webroot /www/wwwroot/cut-mcp
#
# 三条与本服务强相关的配置，缺一条就出问题：
#   client_max_body_size  音频上传默认 1m 会被 nginx 挡成 413
#   proxy_read_timeout    渲染等待 90s，默认 60s 会被掐断成 504
#   proxy_buffering off   响应是 JSON-RPC 单包，关缓冲让超时与断连更早暴露

server {
    listen 80;
    server_name cut-mcp.1task.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name cut-mcp.1task.cn;

    ssl_certificate     /www/server/panel/vhost/cert/cut-mcp.1task.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/cut-mcp.1task.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    access_log /www/wwwlogs/cut-mcp.1task.cn.log;
    error_log  /www/wwwlogs/cut-mcp.1task.cn.error.log warn;

    # 上传上限与 compose 里的 CUTDUO_MAX_UPLOAD_MB 保持一致
    client_max_body_size 64m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;

        # 渲染最长等待 90s，留余量到 180s
        proxy_connect_timeout 10s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;

        proxy_buffering off;
        proxy_request_buffering off;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8787/health;
        access_log off;
    }
}
