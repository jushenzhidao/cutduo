# cutduo MCP · ai-prod 部署
#
# 端口只绑回环：对外一律走 nginx（证书与上传体积都在那一层管）。
# 渲染是 CPU 密集，容器内并发上限 3（每个 job 8 worker），与 64 核机器匹配。

services:
  cutduo-mcp:
    build:
      context: ..
      dockerfile: mcp/Dockerfile
    image: cutduo-mcp:2.0.0
    container_name: cutduo-mcp
    restart: unless-stopped
    # 资源上限不是性能参数，是安全边界。2026-11-16 一次 crf15+slow 的长片
    # 在没有上限的容器里把 64 核机器打到 swap thrashing，SSH 登不进、整机失联十几分钟。
    # 16G 对应 8 worker × 512MB 堆 + canvas/native 的余量；24 核留给渲染，
    # 其余核给机器上另外 30 多个服务。
    mem_limit: 20g
    cpus: "28"
    # 透传核显给 h264_qsv 用。宿主有 card1 + renderD128（i9-14900KS 的 UHD 770）。
    devices:
      - /dev/dri:/dev/dri
    # 宿主 render 组（GID 992）拥有 /dev/dri/renderD128；不加这条
    # 容器里的 node 用户打不开设备，QSV 会报 unsupported(-3)。
    group_add:
      - "992"
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      # 必填：否则任何人都能往服务器传文件、烧 CPU
      CUTDUO_TOKEN: ${CUTDUO_TOKEN:?CUTDUO_TOKEN 未设置，先 export}
      CUTDUO_PUBLIC_URL: https://mcp.chatfire.cn
      # 实测这台机器（Xeon E5-2682 v4，单核弱、核多）并发是负收益：
      # 3 个任务并发 76s，串行 3×(worker=32) 约 58s。每个渲染已吃满 cpus/2，
      # 再并发只是互相抢核。设 1 让第二个请求排队，比两个都变慢好。
      CUTDUO_MAX_JOBS: "1"
      CUTDUO_WAIT_SECONDS: "90"
      CUTDUO_MAX_UPLOAD_MB: "64"
      CUTDUO_ASSET_TTL_DAYS: "7"
      # 容器里没有 .git，仓库根只能显式给
      CUTDUO_ROOT: /app
      CUTDUO_OUT: /data/out
      CUTDUO_DATA: /data
    volumes:
      - /opt/cutduo/data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
