<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>夜色卡片</title>
<style>
  html, body { margin: 0; padding: 0; background: #101a1e; overflow: hidden; }
  canvas { display: block; }
  img { display: none; }
</style>
</head>
<body>
<!-- 这里只放“宿主相关”的东西：canvas 标签、预加载 img、脚本加载顺序。
     kit.js 与 layouts.js 不得出现 document / window / createElement，否则换宿主不成立。 -->
<canvas id="c" width="1080" height="1920"></canvas>

<!-- 素材按 asset-manifest.json 用 data-* 挂载，代码里按 key 取，不写路径 -->
<img data-prop="placeholder" src="../assets/placeholder.png" alt="">

<script src="kit.js"></script>
<script src="layouts.js"></script>
<script src="stage.js"></script>
<script src="main.js"></script>
</body>
</html>
