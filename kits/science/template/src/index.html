<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>科普视频版式 · Knowledge Explainer</title>
<style>
  html, body { margin: 0; padding: 0; background: #101a1e; overflow: hidden; }
  canvas { display: block; }
  img { display: none; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<img data-mouth="half" src="../assets/figures/mouth/m_half.png" alt="">
<img data-mouth="open" src="../assets/figures/mouth/m_open.png" alt="">
<img data-mouth="round" src="../assets/figures/mouth/m_round.png" alt="">
<img data-prop="gut" src="../assets/props/gut.png" alt="">
<img data-prop="hip-joint" src="../assets/props/hip-joint.png" alt="">
<img data-prop="hip-joint-v2" src="../assets/props/hip-joint-v2.png" alt="">
<img data-prop="drop" src="../assets/props/drop.png" alt="">
<img data-prop="clock" src="../assets/props/clock.png" alt="">
<img data-prop="shield" src="../assets/props/shield.png" alt="">
<img data-prop="check" src="../assets/props/check.png" alt="">
<img data-prop="radiation" src="../assets/props/radiation.png" alt="">
<img data-fig="idle" src="../assets/figures/idle.png" alt="">
<img data-fig="explain" src="../assets/figures/explain.png" alt="">
<img data-fig="point" src="../assets/figures/point.png" alt="">
<img data-fig="open" src="../assets/figures/open.png" alt="">
<script>
/* 浏览器宿主：把 <img data-*> 绑成按 key 取的对象。
   绘制层（kit.js / layouts.js）不碰 DOM；Skia 宿主由 science.mjs 注入同名对象。 */
(function () {
  const bind = (sel, key, attr) => {
    const into = (window[key] = window[key] || {});
    document.querySelectorAll(sel).forEach((el) => { into[el.dataset[attr]] = el; });
  };
  bind('img[data-prop]', '__MK_PROPS', 'prop');
  bind('img[data-mouth]', '__MK_MOUTHS', 'mouth');
  bind('img[data-fig]', '__MK_FIGS', 'fig');
})();
</script>
<script src="kit.js"></script>
<script src="layouts.js"></script>
<script src="main.js"></script>
</body>
</html>
