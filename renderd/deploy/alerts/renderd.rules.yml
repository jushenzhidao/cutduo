# renderd 告警规则（Prometheus rule file）
#
# 为什么是这五条：出事故时最先要回答的三个问题 ——
#   1. 客户的任务卡住了吗？      → 队列最老等待 / worker 是否还在领
#   2. 是不是在批量失败？        → 24h 失败数的增量
#   3. 服务还活着吗、盘满没满？  → 抓取缺失 / 磁盘水位
#
# 指标语义的坑（都在 metrics() 里踩过）：
#   · renderd_failed_jobs_24h 是**滚动 24 小时的计数**（gauge），判断「新失败」
#     要用 delta()，不能用 increase() 于 counter 的直觉去写 rate()。
#   · renderd_tenant_inflight 现在对它所有登记租户都发 0 值，所以 absent() 可直接用。
#   · 队列深度 > 0 在单 worker 下是常态（串行），真正该报的是**最老等待时间**。

groups:
  - name: renderd.rules
    rules:
      - alert: RenderdQueueStuck
        expr: max_over_time(renderd_queue_oldest_wait_seconds[10m]) > 120
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "任务排队超过 2 分钟（最老等了 {{ $value | humanizeDuration }}）"
          description: >-
            单 worker 串行吞吐约 5.6 任务/分钟（180 帧）。持续排队说明提交量超过产能，
            或 worker 卡在某个任务上。先看 `/v1/queue` 与 `job_events` 最后一条阶段。

      - alert: RenderdNoWorkerClaiming
        expr: renderd_queue_depth > 0 and renderd_jobs_running == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "有任务在排队但没有任何任务在跑 —— worker 可能已经死了"
          description: >-
            队列非空且 running 为 0 持续 5 分钟，通常是 worker 容器退出或连不上 PG。
            `docker ps` 里 renderd-worker-1 的 unhealthy 是**已知误报**（探针去连 worker
            不监听的端口），不要因为 unhealthy 就重启；要看容器是否还在 Up。

      - alert: RenderdJobFailures
        expr: delta(renderd_failed_jobs_24h[15m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "15 分钟内新增 {{ $value }} 个失败任务"
          description: >-
            失败是永久性错误（transient 会自动重试）。查 `GET /v1/dlq` 里的 error_code：
            E_INPUT_* 是素材问题，E_IR_* 是调用方参数问题，E_RENDER_FAILED 才是我们自己的问题。

      - alert: RenderdMetricsAbsent
        expr: absent(renderd_uptime_seconds)
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "抓不到 renderd 指标 —— 服务不可用，或 /metrics 白名单把 Prometheus 挡了"
          description: >-
            /metrics 有来源白名单（RENDERD_METRICS_ALLOW）。如果刚改过网关或换过抓取源，
            先确认来源 IP 在白名单里，再判断服务是否真的挂了。

      - alert: RenderdDiskLow
        expr: |
          node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"}
            / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} < 0.05
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "根分区可用空间低于 5%"
          description: >-
            renderd 会在 /data 下留素材、mezz、成片与证据图（180 帧任务约 12 MB/个）。
            盘满时 /readyz 会返回 503 停止接新任务，但已写入的回执会不完整。
            清理顺序：`renderd gc --assets`（默认 dry-run）→ 手动删 out/ 里过期的成片。
